<!doctype html>

<title>다낭 4박 5일</title>

<style>
:root{
  --bg:#FAF6F8; --card:#FFFFFF; --ink:#2E2622; --mut:#8A7C73; --line:#F2E9EF; --line2:#E6D8E1;
  --acc:#845578; --acc-soft:#EFE4EE; --acc-ink:#FFFFFF; --nav-off:#BCAAB5;
  --good:#2F7A5F; --bad:#B0413E;
  --shadow:0 2px 12px rgba(70,40,60,.07);
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --serif:'Noto Serif KR','Apple Myungjo',serif;
  --script:'Cormorant Garamond','Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));position:relative}
.pad{padding-inline:20px}
.banner{background:#3B2A36;color:#F6EAF1;font-size:12.5px;padding:8px 16px;text-align:center}
/* hero */
.hero{position:relative;height:380px;overflow:hidden;background:#caa}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;filter:saturate(1.02) contrast(.95) brightness(1.04) sepia(.08);display:block}
.hero .scrim{position:absolute;inset:auto 0 0 0;height:210px;background:linear-gradient(rgba(40,28,34,0),rgba(40,28,34,.58))}
.hero .dday{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top,0px));background:rgba(255,248,250,.9);color:#5A3A4E;font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:12px}
.hero .me{position:absolute;left:18px;top:calc(18px + env(safe-area-inset-top,0px));background:rgba(255,248,250,.9);color:#5A3A4E;border:0;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:12px}
.hero .txt{position:absolute;left:22px;right:22px;bottom:44px;color:#FFF8F6}
.hero .eyebrow{font-family:var(--script);font-style:italic;font-size:19px;letter-spacing:.5px;opacity:.95}
.hero h1{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.02;margin:0;letter-spacing:-.5px}
.hero .hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px}
.hero .when{font-size:13px;line-height:1.45;opacity:.95}
.hero .credit{position:absolute;right:12px;bottom:28px;font-size:10px;color:rgba(255,248,246,.75);text-decoration:none}
.sheetwrap{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding-top:6px}
/* chips */
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
.chip.lg{font-size:12.5px;padding:4px 10px;border-radius:12px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
/* sections */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec h2{font-size:19px;font-weight:800;margin:0}
.sec .aside{font-size:13px;color:var(--mut)}
.linkbtn{background:none;border:0;color:var(--acc);font-weight:700;font-size:13.5px;padding:6px 0}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
/* stays */
.stays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.stay{background:none;border:0;padding:0;text-align:left}
.stay .ph{position:relative;height:124px;border-radius:16px;overflow:hidden;background:var(--acc-soft);box-shadow:0 6px 16px rgba(70,40,60,.14);display:flex;align-items:center;justify-content:center;color:var(--acc)}
.stay .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stay .nights{position:absolute;left:8px;top:8px;background:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:3px 8px;color:var(--ink)}
.stay .nm{font-size:15px;font-weight:700;margin-top:9px}
.stay .dt{font-size:12.5px;color:var(--mut);margin-top:1px}
.stay .by{font-size:12.5px;margin-top:4px}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;border-radius:16px;background:#fff;color:var(--mut);box-shadow:0 1px 4px rgba(70,40,60,.08);font-size:13px;font-weight:700;padding:8px 14px}
.tab.on{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.daytabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.daytab{border:0;border-radius:14px;background:#fff;color:var(--mut);box-shadow:0 1px 4px rgba(70,40,60,.08);padding:8px 0;line-height:1.3}
.daytab b{display:block;font-size:12.5px;font-weight:800}
.daytab span{font-size:11.5px}
.daytab.on{background:var(--acc);color:#fff;box-shadow:none}
/* list rows */
.list{padding:2px 16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed #EEE2E9}
.row:last-child{border-bottom:0}
.step{width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grow{flex:1;min-width:0}
.t1{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.t2{font-size:12.5px;color:var(--mut);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.time{font-size:12.5px;color:var(--mut);font-weight:700}
.iconbtn{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty{padding:22px 16px;text-align:center;color:var(--mut);font-size:13.5px}
/* checklist */
.bar{height:6px;border-radius:3px;background:#EADFE8;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--acc)}
.check{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid #D8C6D1;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.box.on{background:var(--acc);border-color:var(--acc)}
.check .txt{flex:1;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.check.done .txt{color:var(--mut);text-decoration:line-through}
.owner{font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px;border:0}
/* page headers */
.phead{padding-top:calc(46px + env(safe-area-inset-top,0px))}
.phead .eyebrow{font-family:var(--script);font-style:italic;font-size:17px;color:var(--acc)}
.phead h1{font-size:26px;font-weight:800;margin:2px 0 0;letter-spacing:-.5px}
.phead p{font-size:13.5px;color:var(--mut);margin:4px 0 0}
/* wish */
.addrow{display:flex;gap:8px;margin-top:16px}
.input{width:100%;min-width:0;height:48px;border-radius:14px;border:1.5px solid transparent;background:#fff;box-shadow:0 1px 6px rgba(70,40,60,.08);padding:0 14px;font-size:15px}
.input:focus{border-color:var(--acc);outline:none}
.plus{width:48px;height:48px;border-radius:14px;border:0;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wish{display:flex;gap:12px;padding:12px}
.wish .ph{width:84px;height:84px;border-radius:14px;flex-shrink:0;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:0}
.wish .ph img{width:100%;height:100%;object-fit:cover}
.wish .body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.wish .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{border:0;border-radius:10px;font-size:12.5px;font-weight:700;padding:7px 12px;white-space:nowrap}
.pill.solid{background:var(--acc);color:#fff}
.pill.soft{background:var(--acc-soft);color:var(--acc)}
.pill.line{background:#fff;color:var(--acc);border:1.5px solid var(--acc);padding:5.5px 10.5px}
.stack{display:flex;flex-direction:column;gap:10px}
/* pay */
.sum{padding:16px}
.sum .big{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.per{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.per div{border-radius:14px;padding:10px 12px}
.per b{display:block;font-size:12px}
.per span{font-size:15px;font-weight:800;color:var(--ink)}
.dayhead{font-size:12.5px;font-weight:800;color:var(--acc);margin:18px 2px 7px}
.cat{width:42px;height:42px;border-radius:13px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.amt{text-align:right;flex-shrink:0}
.amt b{display:block;font-size:15.5px;font-weight:800}
.amt span{font-size:11.5px;color:var(--mut)}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(88px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--acc);color:#fff;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;box-shadow:0 8px 20px rgba(132,85,120,.35);z-index:20}
/* settle */
.secn{display:flex;align-items:center;gap:8px;margin:26px 2px 10px}
.secn i{font-family:var(--script);font-size:17px;color:var(--acc)}
.secn b{font-size:17px;font-weight:800}
.donut{display:flex;align-items:center;gap:12px;padding:16px 14px}
.legend{flex:1;display:flex;flex-direction:column;gap:11px;min-width:0}
.legend div{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.legend .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.calc{padding:16px}
.rate{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);gap:8px}
.rate input{width:72px;height:36px;border:1.5px solid var(--line2);border-radius:9px;text-align:right;padding:0 10px;font-weight:800}
.share{display:flex;justify-content:center;align-items:baseline;gap:8px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.share b{font-size:20px;color:var(--acc)}
.tbl{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.tbl.h{font-size:12px;color:var(--mut);font-weight:700;border-top:0;padding-top:10px}
.tbl>:not(:first-child){text-align:right}
.names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.names button{border:0;border-radius:14px;padding:12px 0;font-size:15px;font-weight:800}
.mine{margin-top:10px;background:#fff;border-radius:20px;padding:16px;border:2px solid var(--acc)}
.send{display:flex;align-items:center;gap:10px;padding:13px 0 3px;flex-wrap:wrap}
.send .won{font-size:19px;font-weight:800}
.note{font-size:12.5px;color:var(--mut);margin:10px 2px 0;line-height:1.5}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#FFFDFE;border-top:1px solid #EFE4EA;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:480px;margin:0 auto;height:70px;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;color:var(--nav-off);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700}
.nav button.on{color:var(--acc)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(40,24,34,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:#DCCBD6;margin:0 auto 14px}
.sheet h3{font-size:19px;font-weight:800;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lb{font-size:13px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line2);background:#fff;border-radius:10px;padding:8px 13px;font-size:14px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.amtrow{display:flex;gap:8px}
.amtrow .input{flex:1}
textarea.input{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:6px}
.actions .pill{flex:1;padding:14px;font-size:15px;border-radius:14px}
.danger{background:#fff;color:var(--bad);border:1.5px solid #EBC9C8}
.photoin{display:flex;align-items:center;gap:10px}
.photoin .thumb{width:64px;height:64px;border-radius:12px;background:var(--acc-soft);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.photoin .thumb img{width:100%;height:100%;object-fit:cover}
.hint{font-size:12px;color:var(--mut)}
.info{padding:4px 16px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.info div:last-child{border-bottom:0}
.info span:first-child{color:var(--mut);flex-shrink:0}
.info span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere;white-space:pre-line}
.bigph{aspect-ratio:16/10;max-width:100%;border-radius:18px;overflow:hidden;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;color:var(--acc);margin-bottom:14px}
.bigph img{width:100%;height:100%;object-fit:cover}
/* who */
.who{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:#3a2a33}
.who img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;filter:saturate(1.02) brightness(.9)}
.who .panel{position:relative;width:100%;max-width:480px;background:var(--bg);border-radius:26px 26px 0 0;padding:26px 22px calc(30px + env(safe-area-inset-bottom,0px))}
.who h2{font-family:var(--serif);font-size:24px;margin:0}
.who p{color:var(--mut);font-size:14px;margin:6px 0 18px}
.who .names button{padding:18px 0;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3B2A36;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:12px;z-index:90;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script type="module">
/* =========================================================

const FIREBASE_CONFIG = {

const dayLabel = d => { const x = dayOf(d); return x ? `DAY ${x.n} · ${x.md} ${x.wd}` : "날짜 없음"; };
const nights = (a,b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 864e5));
const mdw = d => { const x = new Date(d + "T00:00:00"); return `${x.getMonth()+1}.${x.getDate()} ${"일월화수목금토"[x.getDay()]}`; };

const COLS = ["stays","plan","wishes","pays","checks"];

const DB = { data:{stays:[],plan:[],wishes:[],pays:[],checks:[]}, meta:{rate:52,sent:{}}, ready:false };
let api;

function seedRows(demo){

function makeLocalApi(){
  const KEY="dn-trip-preview-v1";
  let st=null;
  try{ st=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  if(!st){
    const s=seedRows(true); st={meta:{rate:52,sent:{}}};
    for(const c of COLS) st[c]=s[c].map((r,i)=>({...r,id:c+"-"+i+"-"+Date.now().toString(36),ts:Date.now()+i}));
  }
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
  const emit=()=>{ for(const c of COLS) DB.data[c]=[...st[c]]; DB.meta={...st.meta}; DB.ready=true; render(); };
  setTimeout(emit,0);
  return {
    add:async(c,o)=>{ const id=c+"-"+Math.random().toString(36).slice(2,9); st[c].push({...o,id,ts:Date.now()}); save(); emit(); return id; },
    update:async(c,id,p)=>{ const r=st[c].find(x=>x.id===id); if(r) Object.assign(r,p); save(); emit(); },
    remove:async(c,id)=>{ st[c]=st[c].filter(x=>x.id!==id); save(); emit(); },
    setMeta:async(p)=>{ st.meta={...st.meta,...p}; save(); emit(); },
    reset:()=>{ try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); }
  };
}

async function makeFirebaseApi(){
  const V="10.12.2";
  const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app=initializeApp(FIREBASE_CONFIG);
  const db=F.getFirestore(app);
  const tripRef=F.doc(db,"trips",TRIP_ID);
  const col=c=>F.collection(db,"trips",TRIP_ID,c);
  let got=new Set();
  const snap0=await F.getDoc(tripRef);
  if(!snap0.exists()){
    const s=seedRows(false);
    await F.setDoc(tripRef,{rate:52,sent:{},created:Date.now()});
    for(const c of ["stays","checks"]) for(const [i,r] of s[c].entries()) await F.addDoc(col(c),{...r,ts:Date.now()+i});
  }
  F.onSnapshot(tripRef,d=>{ DB.meta={rate:52,sent:{},...(d.data()||{})}; got.add("meta"); if(got.size>COLS.length) DB.ready=true; render(); });
  for(const c of COLS){
    F.onSnapshot(F.query(col(c),F.orderBy("ts")),q=>{ DB.data[c]=q.docs.map(d=>({id:d.id,...d.data()})); got.add(c); if(got.size>COLS.length) DB.ready=true; render(); },
      e=>toast("불러오기 실패: Firebase 규칙을 확인해 주세요"));
  }
  return {
    add:async(c,o)=>(await F.addDoc(col(c),{...o,ts:Date.now()})).id,
    update:(c,id,p)=>F.updateDoc(F.doc(db,"trips",TRIP_ID,c,id),p),
    remove:(c,id)=>F.deleteDoc(F.doc(db,"trips",TRIP_ID,c,id)),
    setMeta:p=>F.setDoc(tripRef,p,{merge:true})
  };
}

function calc(){
  const pays=DB.data.pays;
  const paid=Object.fromEntries(PEOPLE.map(n=>[n,0])), owe=Object.fromEntries(PEOPLE.map(n=>[n,0]));
  const byCat=Object.fromEntries(CATS.map(c=>[c,0]));
  let total=0;
  for(const p of pays){
    const v=krw(p); total+=v; byCat[p.cat]=(byCat[p.cat]||0)+v;
    if(paid[p.payer]!=null) paid[p.payer]+=v;
    const sp=(p.split&&p.split.length?p.split:PEOPLE).filter(n=>PEOPLE.includes(n));
    sp.forEach(n=>owe[n]+=v/sp.length);
  }
  const diff={}; PEOPLE.forEach(n=>diff[n]=Math.round(paid[n]-owe[n]));
  const res=PEOPLE.reduce((a,n)=>a+diff[n],0);
  if(res!==0){ const top=[...PEOPLE].sort((a,b)=>diff[b]-diff[a])[0]; diff[top]-=res; }
  const cr=PEOPLE.filter(n=>diff[n]>0).map(n=>({n,v:diff[n]})).sort((a,b)=>b.v-a.v);
  const db=PEOPLE.filter(n=>diff[n]<0).map(n=>({n,v:-diff[n]})).sort((a,b)=>b.v-a.v);
  const tr=[]; let i=0,j=0;
  while(i<db.length&&j<cr.length){ const m=Math.min(db[i].v,cr[j].v); if(m>0) tr.push({from:db[i].n,to:cr[j].n,amt:m}); db[i].v-=m; cr[j].v-=m; if(db[i].v===0)i++; if(cr[j].v===0)j++; }
  const equal=pays.every(p=>!p.split||p.split.length===PEOPLE.length);
  return {paid,owe,diff,tr,total,byCat,equal};
}

function donut(byCat,total){
  const segs=CATS.map(c=>({c,v:byCat[c]||0})).filter(s=>s.v>0);
  if(!total) return `<div class="empty">결제를 올리면 분류별로 나눠서 보여줘요.</div>`;
  const raw=segs.map(s=>s.v/total*100), fl=raw.map(Math.floor); let left=100-fl.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(left>0){fl[i]++;left--;} });
  let off=0; const gap=segs.length>1?0.9:0;
  const circ=segs.map((s,i)=>{ const p=raw[i]; const el=`<circle cx="70" cy="70" r="54" fill="none" stroke="${CATCOL[s.c]}" stroke-width="22" pathLength="100" stroke-dasharray="${Math.max(p-gap,0.3).toFixed(2)} 100" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${s.c} ${won(s.v)} (${fl[i]}%)</title></circle>`; off+=p; return el; }).join("");
  const man=total>=10000?(Math.round(total/1000)/10).toLocaleString("ko-KR")+"만원":won(total);
  return `<div class="donut"><svg width="118" height="118" viewBox="0 0 140 140" role="img" aria-label="분류별 지출: ${segs.map((s,i)=>s.c+" "+fl[i]+"%").join(", ")}" style="flex-shrink:0">${circ}<text x="70" y="65" text-anchor="middle" font-size="11" fill="#8A7C73" font-family="Noto Sans KR, sans-serif">총 지출</text><text x="70" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="#2E2622" font-family="Noto Sans KR, sans-serif">${man}</text></svg>
    <div class="legend">${segs.map((s,i)=>`<div><span class="sw" style="background:${CATCOL[s.c]}"></span><b style="width:30px">${s.c}</b><span class="num" style="flex:1;text-align:right">${won(s.v)}</span><span class="num" style="width:38px;text-align:right;color:var(--mut)">${fl[i]}%</span></div>`).join("")}</div></div>`;
}

const segVal=(root,name)=>{ const s=root.querySelector(`[data-seg="${name}"]`); const on=[...s.querySelectorAll("button.on")].map(b=>b.dataset.v); return s.dataset.multi==="1"?on:(on[0]||""); };

async function readPhoto(file,max=1000){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=.78, out=c.toDataURL("image/jpeg",q);
    while(out.length>700000&&q>.4){ q-=.1; out=c.toDataURL("image/jpeg",q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

    case "delCheck": await api.remove("checks",id); closeSheet(); break;
    case "wishF": UI.wishF=el.dataset.k; render(); break;
    case "toPlan": { const w=byId("wishes",id); const p=DB.data.plan.find(x=>x.wishId===id); if(p) planForm(p); else planForm(null,{title:w.title,memo:w.place||"",wishId:id,day:UI.day}); break; }
    case "editWish": wishForm(byId("wishes",id)); break;
    case "delWish": { await api.remove("wishes",id); for(const p of DB.data.plan.filter(x=>x.wishId===id)) await api.update("plan",p.id,{wishId:""}); closeSheet(); toast("지웠어요"); break; }
    case "payF": UI.payF=el.dataset.k; render(); break;
    case "addPay": payForm(null); break;
    case "editPay": payForm(byId("pays",id)); break;
    case "delPay": await api.remove("pays",id); closeSheet(); toast("지웠어요"); break;
    case "settleName": UI.settleName=el.dataset.k; render(); break;
    case "sent": { const k=el.dataset.k; const sent={...(DB.meta.sent||{})}; sent[k]=!sent[k]; await api.setMeta({sent}); break; }
    case "resetDemo": api.reset&&api.reset(); break;
  }
  }catch(err){ toast("저장하지 못했어요. 인터넷 연결을 확인해 주세요."); }
});
document.addEventListener("submit",async e=>{
  const f=e.target.closest('[data-form="quickWish"]'); if(!f) return; e.preventDefault();
  const inp=f.querySelector("input"); const t=inp.value.trim(); if(!t) return;
  try{ await api.add("wishes",{title:t,place:"",by:ME||"",photo:"",day:"",slot:""}); inp.value=""; toast("올렸어요"); }catch(err){ toast("올리지 못했어요. 인터넷 연결을 확인해 주세요."); }
});
document.addEventListener("change",async e=>{
  if(e.target.dataset.change==="rate"){ const v=parseFloat(String(e.target.value).replace(/,/g,"")); if(v>0){ try{ await api.setMeta({rate:v}); toast(`환율을 1,000동 = ${v}원으로 바꿨어요`);}catch(err){toast("저장하지 못했어요.");} } else toast("환율을 숫자로 넣어 주세요."); }
});

/* ---------- 시작 ---------- */
render();
if(live){ makeFirebaseApi().then(a=>{api=a;}).catch(err=>{ console.error(err); document.getElementById("app").innerHTML=`<div class="pad phead"><h1>연결이 안 돼요</h1><p>Firebase 설정값을 다시 확인해 주세요. (${esc(err.message||err)})</p></div>`; }); }
else { api=makeLocalApi(); }
</script>
